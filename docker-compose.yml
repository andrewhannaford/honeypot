services:
  honeypot:
    build: .
    network_mode: host
    cap_add: [NET_BIND_SERVICE]
    environment:
      # No DISCORD_WEBHOOK_URL here by design — the webhook secret lives on your
      # trusted network, not on this box. See config.py and README.md.
      - OUTBOX_TOKEN=${OUTBOX_TOKEN:-}
      - ALERT_OUTBOX_MAX=${ALERT_OUTBOX_MAX:-5000}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Defaulted here (not left blank) so a fresh checkout with no .env doesn't
      # make a live outbound call to ipinfo.io on first boot — see config.py's
      # _resolve_server_coords(). Clear these two if you *want* auto-detection.
      - SERVER_LAT=${SERVER_LAT:-40.7128}
      - SERVER_LON=${SERVER_LON:--74.0060}
      - SSH_ACCEPT_RATE=${SSH_ACCEPT_RATE:-5}
      - TELNET_ACCEPT_RATE=${TELNET_ACCEPT_RATE:-3}
      - HTTPS_PORT=${HTTPS_PORT:-8443}
      - HTTPS_CERT_CN=${HTTPS_CERT_CN:-web-prod-01.internal}
      - MYSQL_VERSION=${MYSQL_VERSION:-5.7.44-log}
      - POSTGRES_VERSION=${POSTGRES_VERSION:-13.11}
    volumes:
      - honeypot-data:/app/data
      # Bind-mounted, not a named volume: suricata_logger.py inside this
      # container tails logs/suricata/eve.json, which only the suricata
      # container below writes to. They need to share one host directory tree
      # for that subpath relationship to exist — a named volume mounted at
      # /app/logs here and separately at /var/log/suricata in the suricata
      # container would NOT nest the same way (each mount would put suricata's
      # files at the volume's root, not under a "suricata/" subdirectory).
      - ./logs:/app/logs
      # Rules the dashboard's rule builder writes (rule_builder.py) — see the
      # matching mount + note on the suricata service below.
      - ./custom.rules:/app/custom.rules
      # Suricata's unix-command control socket, so rule_builder.py can issue
      # "reload-rules" after writing a new rule instead of restarting the
      # container (which would briefly drop af-packet capture).
      - ./run/suricata:/app/suricata_run
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    # Set SURICATA_IFACE in .env to match your network interface (run
    # "ip link show" to find yours — the default below is almost certainly wrong
    # for your host).
    command: --af-packet=${SURICATA_IFACE:-ens33}
    volumes:
      - ./logs/suricata:/var/log/suricata
      # NOT :ro — jasonish/suricata's entrypoint chowns suricata.yaml on startup
      # and crash-loops if it can't (confirmed: "Read-only file system", container
      # stuck in Restarting). Same entrypoint also chowns /var/lib/suricata and
      # /var/run/suricata recursively on every boot, which is why custom.rules and
      # the run/ directory below are world-writable (chmod 666 / 777) rather than
      # precisely UID-matched — Suricata's image controls its own internal UID, not
      # something this project can pin, and neither path holds anything sensitive
      # (rule text; a control socket already gated by container/filesystem access).
      - ./suricata.yaml:/etc/suricata/suricata.yaml
      - ./suricata.rules:/var/lib/suricata/rules/suricata.rules
      - ./custom.rules:/var/lib/suricata/rules/custom.rules
      - ./run/suricata:/var/run/suricata
    restart: unless-stopped

volumes:
  honeypot-data:
