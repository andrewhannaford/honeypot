[pytest]
# Without this, pytest's default rootdir-wide discovery walked into backups/
# (dozens of dated snapshot copies of app.py/logger.py/etc. under different
# names) and collided with the real modules of the same name during
# collection — corrupting unrelated tests with ImportErrors depending on
# which file pytest happened to import first. Only tests/ is ever real
# test source.
testpaths = tests
